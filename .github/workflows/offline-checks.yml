name: Offline demos and fail-closed tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit test receive-only parser
        run: python3 -m unittest discover -s tests -v
      - name: Parse fabricated CAN log
        run: python3 tools/candump_catalog.py examples/synthetic_can.log --out /tmp/bmw-summary.csv
      - name: Compile offline state machine demo
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Ifirmware/include firmware/src/main.c firmware/src/state_machine.c -o /tmp/bmw-fle-sim && /tmp/bmw-fle-sim
      - name: Compile safety-state tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Ifirmware/include firmware/tests/test_state_machine.c firmware/src/state_machine.c -o /tmp/fle-tests && /tmp/fle-tests
